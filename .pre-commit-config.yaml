minimum_prek_version: "0.4.14"
default_install_hook_types: [pre-commit, pre-push, commit-msg]
default_stages: [pre-commit]
repos:
  - repo: builtin
    hooks:
      - id: check-added-large-files
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: require-pattern
        name: commit subject
        stages: [commit-msg]
        args: ['--multiline', '\A(Merge |(feat|fix|docs|refactor|test|build|conf): [a-z])']
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - id: actionlint
        files: ^\.github/workflows/
        args: [-shellcheck=, -pyflakes=]
  - repo: local
    hooks:
      - id: uv-lock-check
        name: lock consistency
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: (^|/)pyproject\.toml$|^uv\.lock$
      - id: ruff-check
        name: ruff check
        entry: uv run --locked --only-group dev ruff check src tests scripts
        language: system
        pass_filenames: false
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --locked --only-group dev ruff format
        language: system
        types: [python]
      - id: mypy
        name: type checks
        entry: uv run --locked --all-extras --group dev mypy src/tisam
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-push]
      - id: tests
        name: offline tests
        entry: uv run --locked --all-extras --group dev pytest -q
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-push]
