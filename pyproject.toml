[project]
name = "tisam"
version = "0.1.0"
description = "Dual-encoder TiSAM architecture, training, and tissue segmentation"
requires-python = ">=3.9"
readme = "README.md"
dependencies = [
  "torch>=2.8.0",
  "torchvision>=0.23.0",
  "timm==1.0.30",
  "numpy>=1.26",
  "pydantic>=2",
  "safetensors==0.6.2",
  "huggingface-hub>=0.36",
  "prettyterm @ git+https://github.com/zydtiger/prettyterm.git@76a34ed70afd5f12ecbc75d6f97c5e9b6ad142ee",
  "typer>=0.21.2,<0.22",
  "pyyaml>=6",
  "einops",
  "psutil",
  "scipy",
  "sam3 @ git+https://github.com/zydtiger/sam3@34b5c4d6e02015863585cf6cacb9432ccda4e0e4",
]

[project.optional-dependencies]
train = [
  "mammoth[tensorboard,torch] @ git+https://github.com/zydtiger/mammoth.git@v0.8.8",
  "albumentations>=2,<3",
  "opencv-python-headless<5.1",
  "pillow",
  "tifffile>=2024.8.28,<2025.5.21; python_version < '3.11'",
  "tifffile>=2025.5.21; python_version >= '3.11'",
  "imagecodecs>=2024.6.1",
  "zarr>=2.18.2,<3; python_version < '3.11'",
  "numcodecs<0.16; python_version < '3.11'",
  "zarr>=3.1.5; python_version >= '3.11'",
]
inference = [
  "albumentations>=2,<3",
  "opencv-python-headless<5.1",
  "pillow",
  "tifffile>=2024.8.28,<2025.5.21; python_version < '3.11'",
  "tifffile>=2025.5.21; python_version >= '3.11'",
  "imagecodecs>=2024.6.1",
  "zarr>=2.18.2,<3; python_version < '3.11'",
  "numcodecs<0.16; python_version < '3.11'",
  "zarr>=3.1.5; python_version >= '3.11'",
  "portalocker>=3.2",
]

[project.scripts]
tisam = "tisam.cli:app"

[project.urls]
Repository = "https://github.com/zydtiger/tisam"
Issues = "https://github.com/zydtiger/tisam/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/tisam"]

[dependency-groups]
dev = ["pytest>=8.4", "ruff>=0.15", "mypy>=1.19", "types-PyYAML"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "D100", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "PLC0415"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "silent"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "real: requires locally available pretrained weights and a CUDA device",
]
addopts = "-m 'not real'"

[tool.hatch.build.targets.sdist]
include = [
  "src",
  "tests",
  "docs",
  "examples",
  "README.md",
  "AGENTS.md",
  "pyproject.toml",
  "uv.lock",
  ".python-version",
  ".pre-commit-config.yaml",
]
