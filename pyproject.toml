[project]
name = "tisam"
version = "0.1.0"
description = "Dual-encoder TiSAM architecture, training, and tissue segmentation"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
  "torch==2.12.1",
  "torchvision==0.27.1",
  "timm==1.0.24",
  "numpy>=1.26,<2",
  "pydantic>=2",
  "safetensors==0.6.2",
  "huggingface-hub==1.25.1",
  "prettyterm>=0.3.0",
  "typer>=0.21.2,<0.22",
  "pyyaml>=6",
  "einops",
  "psutil",
  "scipy",
  "sam3 @ git+https://github.com/zydtiger/sam3@46520ff4d8910ba83a247dd26733b12bba019017",
]

[project.optional-dependencies]
train = [
  "mammoth[tensorboard,torch] @ git+https://github.com/zydtiger/mammoth.git@1193a787af6251c3577fc2732cc77ad4d1143b3a",
  "albumentations>=2,<3",
  "opencv-python-headless<4.12",
  "pillow",
  "tifffile>=2025.10.16",
  "imagecodecs>=2025.11.11",
  "zarr>=3.1.5",
]
inference = [
  "mammoth @ git+https://github.com/zydtiger/mammoth.git@1193a787af6251c3577fc2732cc77ad4d1143b3a",
  "albumentations>=2,<3",
  "opencv-python-headless<4.12",
  "pillow",
  "tifffile>=2025.10.16",
  "imagecodecs>=2025.11.11",
  "zarr>=3.1.5",
]

[project.scripts]
tisam = "tisam.cli:app"

[project.urls]
Repository = "https://github.com/zydtiger/tisam"
Issues = "https://github.com/zydtiger/tisam/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/tisam"]

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.15", "mypy>=1.19", "types-PyYAML"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "D100", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "PLC0415"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "silent"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "real: requires locally available pretrained weights and a CUDA device",
]
addopts = "-m 'not real'"

[tool.hatch.build.targets.sdist]
include = [
  "src",
  "tests",
  "docs",
  "examples",
  "README.md",
  "AGENTS.md",
  "pyproject.toml",
  "uv.lock",
  ".python-version",
  ".pre-commit-config.yaml",
]
