name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python-version: ["3.9", "3.12", "3.14"]
    env:
      CUDA_VISIBLE_DEVICES: ""
      HF_HUB_OFFLINE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.x"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-suffix: ${{ matrix.os }}-python-${{ matrix.python-version }}
          prune-cache: true

      - name: Install project and all optional workflows
        run: uv sync --locked --all-extras --group dev

      - name: Exercise the minimum inference stack
        if: matrix.python-version == '3.9'
        run: >-
          uv pip install torch==2.8.0 torchvision==0.23.0 numpy==1.26.4
          tifffile==2024.8.28 imagecodecs==2024.6.1 zarr==2.18.2 numcodecs==0.12.1

      - name: Run commit-stage hooks
        if: matrix.python-version == '3.12'
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        env:
          UV_NO_SYNC: "1"
        with:
          prek-version: "0.4.x"
          extra-args: --all-files

      - name: Run push-stage hooks
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        env:
          # Preserve the explicitly installed minimum-stack versions on Python 3.9.
          UV_NO_SYNC: "1"
        with:
          prek-version: "0.4.x"
          cache: false
          extra-args: --all-files --hook-stage pre-push

      - name: Build distribution and verify base wheel installation
        if: matrix.python-version == '3.12'
        run: uv run --locked --no-sync python scripts/verify_wheel.py
