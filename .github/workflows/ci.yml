name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.9", "3.12", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.12"
    env:
      CUDA_VISIBLE_DEVICES: ""
      HF_HUB_OFFLINE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.10.x"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-suffix: ${{ matrix.os }}-python-${{ matrix.python-version }}
          prune-cache: true

      - name: Install project and all optional workflows
        run: uv sync --locked --all-extras --group dev

      - name: Exercise the minimum inference stack
        if: matrix.python-version == '3.9'
        run: >-
          uv pip install torch==2.8.0 torchvision==0.23.0 numpy==1.26.4
          tifffile==2024.8.28 imagecodecs==2024.6.1 zarr==2.18.2 numcodecs==0.12.1

      - name: Run commit-stage hooks
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        env:
          UV_NO_SYNC: "1"
        with:
          prek-version: "0.4.x"
          extra-args: --all-files

      - name: Run push-stage hooks
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        env:
          # Preserve the explicitly installed minimum-stack versions on Python 3.9.
          UV_NO_SYNC: "1"
        with:
          prek-version: "0.4.x"
          cache: false
          extra-args: --all-files --hook-stage pre-push

      - name: Build distribution and verify base wheel installation
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        shell: bash
        run: |
          smoke_dir=$(mktemp -d)
          trap 'rm -rf "$smoke_dir"' EXIT
          uv build --out-dir "$smoke_dir/dist"
          uv export --locked --no-dev --no-emit-project --no-hashes > "$smoke_dir/constraints.txt"
          uv venv "$smoke_dir/venv"
          uv pip install --python "$smoke_dir/venv/bin/python" \
            --constraint "$smoke_dir/constraints.txt" "$smoke_dir"/dist/*.whl
          cd "$smoke_dir"
          "$smoke_dir/venv/bin/python" -I -c \
            'from tisam import TiSAM, ModelConfig, load_model; import importlib.util; assert importlib.util.find_spec("mammoth") is None'
          "$smoke_dir/venv/bin/tisam" --help
